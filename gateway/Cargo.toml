[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/llmsmartgate"

[workspace.dependencies]
# Web framework & HTTP
axum = "0.8"
axum-extra = { version = "0.12", features = ["typed-header"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "limit", "trace", "request-id", "timeout"] }
hyper = "1"
# Uses rustls with ring crypto provider (no aws-lc-sys C dependency).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "query", "form"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "uuid", "chrono", "json", "migrate", "derive"] }

# Redis / Valkey
redis = { version = "1", features = ["aio", "tokio-comp"] }
deadpool-redis = "0.23"

# Cryptography
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry-otlp = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
moka = { version = "0.12", features = ["future"] }
dotenvy = "0.15"
config = "0.15"
num_cpus = "1"
http-body-util = "0.1"

# Testing
wiremock = "0.6"
assert-json-diff = "2"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
