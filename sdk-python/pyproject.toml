[project]
name = "llmsmartgate"
version = "0.1.0"
description = "Python SDK for LLMSmartGate -- self-hosted LLM API gateway"
readme = "README.md"
authors = [
    { name = "Dat Nguyen", email = "dat.nguyenth@one-line.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "PyNaCl>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "mypy>=1.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
