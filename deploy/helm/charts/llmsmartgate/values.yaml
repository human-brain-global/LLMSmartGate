# Default values for llmsmartgate
# See ARC-001 Section 20.2 for resource sizing guidelines

gateway:
  replicaCount: 3
  image:
    repository: llmsmartgate/gateway
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 512Mi
  service:
    port: 8080

adminConsole:
  replicaCount: 2
  image:
    repository: llmsmartgate/admin-console
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    port: 3000
